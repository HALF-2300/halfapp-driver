# Reference copy of /etc/nginx/sites-available/halfapp-staging on the VPS.
# OSRM listens on 127.0.0.1:5000 only (see docker-compose override).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # After certbot: proxy OSRM for external health checks (optional).
    # location /osrm/ {
    #     proxy_pass http://127.0.0.1:5000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    # }
}
